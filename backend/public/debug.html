<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Debug Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .panel {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #f9f9f9;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .response {
            background-color: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
        }

        .provider-info {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        .sample-button {
            background-color: #2196F3;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .debug-info {
            font-size: 12px;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .test-suite {
            margin-top: 20px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }

        .model-selector {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .provider-selector {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <h1>AI Chat Debug Tool</h1>

    <div class="container">
        <div class="panel">
            <h2>Input</h2>

            <div>
                <label for="provider">AI Provider:</label>
                <select id="provider" class="provider-selector">
                    <option value="">Default</option>
                    <option value="gemini">Gemini</option>
                    <option value="openai">OpenAI</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="claude">Claude</option>
                </select>

                <label for="model">Model:</label>
                <select id="model" class="model-selector">
                    <option value="">Default</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-pro">Gemini Pro</option>
                </select>
            </div>

            <h3>Sample Questions</h3>
            <div>
                <button class="sample-button" onclick="loadSample('what')">What is the document about?</button>
                <button class="sample-button" onclick="loadSample('context')">Explain the context</button>
                <button class="sample-button" onclick="loadSample('military')">Tell me about the military</button>
                <button class="sample-button" onclick="loadSample('economy')">How was the economy?</button>
                <button class="sample-button" onclick="loadSample('caesar')">Who was Julius Caesar?</button>
                <button class="sample-button" onclick="loadSample('risk')">What is risk analysis?</button>
            </div>

            <h3>Message</h3>
            <textarea id="message" placeholder="Enter your message here...">What is the document about?</textarea>

            <h3>Document Context</h3>
            <textarea id="context" placeholder="Enter document context here...">
# Roman Empire

The Roman Empire was the post-Republican period of ancient Rome. As a polity, it included large territorial holdings around the Mediterranean Sea in Europe, North Africa, and Western Asia, ruled by emperors.

## Military

The Roman military was the most successful and powerful in the Mediterranean region, with a strong navy and highly disciplined soldiers. The Roman legions were the main unit of the army.

## Economy

The economy of the early Roman Empire was largely agrarian and centered in the Mediterranean region. The main exports were wine, olive oil, and garum.

## Culture

Roman culture was heavily influenced by the Greeks. The Romans developed literature, poetry, history, and rhetoric. Latin was the official language of the empire.
</textarea>

            <div>
                <button onclick="sendMessage()">Send Message</button>
                <button onclick="clearContext()" style="background-color: #f44336;">Clear Context</button>
            </div>

            <h3>API URL</h3>
            <input type="text" id="apiUrl" value="http://localhost:3001/api/test/ai-chat"
                style="width: 100%; padding: 8px; margin-bottom: 10px;">

            <div class="test-suite">
                <h3>Test Suite</h3>
                <button onclick="runTestSuite()" style="background-color: #9c27b0;">Run All Tests</button>
                <div id="test-results" style="margin-top: 10px;"></div>
            </div>

            <div class="debug-info" id="debug-info">
                <strong>Debug Info:</strong>
                <div id="debug-content">No debug information yet</div>
            </div>
        </div>

        <div class="panel">
            <h2>Response</h2>
            <div id="loading" style="display: none;">Loading...</div>
            <div id="response" class="response">
                <p>Response will appear here...</p>
            </div>
            <div id="provider-info" class="provider-info"></div>
            <div id="response-debug" class="debug-info" style="display: none;">
                <strong>Response Debug:</strong>
                <pre id="response-debug-content"></pre>
            </div>
        </div>
    </div>

    <script>
        // Sample questions
        const samples = {
            'what': 'What is the document about?',
            'context': 'Can you explain the context?',
            'military': 'Tell me about the Roman military.',
            'economy': 'How was the economy of the Roman Empire?',
            'caesar': 'Who was Julius Caesar?',
            'risk': 'What is risk analysis according to the document?'
        };

        function loadSample(key) {
            document.getElementById('message').value = samples[key];
        }

        function clearContext() {
            document.getElementById('context').value = '';
        }

        function addDebugInfo(message) {
            const debugContent = document.getElementById('debug-content');
            const timestamp = new Date().toLocaleTimeString();
            debugContent.innerHTML += `<p>[${timestamp}] ${message}</p>`;
            // Auto-scroll to bottom
            const debugInfo = document.getElementById('debug-info');
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        async function sendMessage() {
            const message = document.getElementById('message').value.trim();
            const context = document.getElementById('context').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const provider = document.getElementById('provider').value;
            const model = document.getElementById('model').value;

            if (!message) {
                alert('Please enter a message');
                return;
            }

            if (!apiUrl) {
                alert('Please enter an API URL');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('response').innerHTML = '<p>Loading...</p>';
            document.getElementById('provider-info').textContent = '';
            document.getElementById('response-debug').style.display = 'none';

            // Add debug info
            addDebugInfo(`Sending request to ${apiUrl}`);
            addDebugInfo(`Message: "${message}"`);
            addDebugInfo(`Context length: ${context.length} characters`);

            try {
                const requestBody = {
                    message,
                    context: context || null,
                    provider: provider || undefined,
                    model: model || undefined
                };

                addDebugInfo(`Request body: ${JSON.stringify(requestBody)}`);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                addDebugInfo(`Response status: ${response.status}`);

                const data = await response.json();
                addDebugInfo(`Response received: ${JSON.stringify(data)}`);

                // Hide loading
                document.getElementById('loading').style.display = 'none';

                if (response.ok) {
                    document.getElementById('response').innerHTML = `<p>${data.message}</p>`;
                    document.getElementById('provider-info').textContent =
                        `Provider: ${data.provider || 'Unknown'}, Model: ${data.model || 'Unknown'}`;

                    // Show debug info if available
                    if (data.debug) {
                        document.getElementById('response-debug').style.display = 'block';
                        document.getElementById('response-debug-content').textContent =
                            JSON.stringify(data.debug, null, 2);
                    }
                } else {
                    document.getElementById('response').innerHTML =
                        `<p class="error">Error: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                addDebugInfo(`Error: ${error.message}`);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('response').innerHTML =
                    `<p class="error">Error: ${error.message}</p>`;
            }
        }

        async function runTestSuite() {
            const testResultsDiv = document.getElementById('test-results');
            testResultsDiv.innerHTML = '<p>Running tests...</p>';

            const testCases = [
                { name: "What is the document about?", message: "What is the document about?" },
                { name: "Explain the context", message: "Can you explain the context?" },
                { name: "Specific topic", message: "Tell me about risk management" },
                { name: "Non-existent topic", message: "Who was Julius Caesar?" }
            ];

            let results = '';

            for (const test of testCases) {
                results += `<h4>Test: ${test.name}</h4>`;

                try {
                    // Save current message
                    const currentMessage = document.getElementById('message').value;

                    // Set test message
                    document.getElementById('message').value = test.message;

                    // Send message
                    await sendMessage();

                    // Get response
                    const response = document.getElementById('response').innerText;

                    // Add to results
                    results += `<pre>${response}</pre>`;

                    // Restore message
                    document.getElementById('message').value = currentMessage;
                } catch (error) {
                    results += `<p class="error">Error: ${error.message}</p>`;
                }

                results += '<hr>';
            }

            testResultsDiv.innerHTML = results;
        }
    </script>
</body>

</html>
